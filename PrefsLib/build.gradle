plugins {
    alias(libs.plugins.android.library)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.javaToolchain.get())
    }
}

android {
    namespace 'com.hardbacknutter.prefslib'

    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        // NEWTHINGS: add app language: add the string res file. No other app changes needed.
        def supportedLocales = [
                "cs", "de", "el", "en", "en_GB", "es", "fr", "gl", "hu", "it", "nl",
                "pl", "pt", "pt_BR", "ru", "sk", "sv", "ta", "tr", "vi",
                "zh_CN", "zh_TW"]
        resourceConfigurations += supportedLocales
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro")
        }
        beta {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11

        // https://developer.android.com/studio/releases/#4-0-0-desugar
        coreLibraryDesugaringEnabled = true
    }

    testOptions {
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    lint {
        abortOnError = false
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }
}

dependencies {
    implementation project(path: ":LiveDataEvent")

    coreLibraryDesugaring(libs.google.desugar)

    implementation(libs.androidx.appcompat)
    implementation(libs.google.material)
}